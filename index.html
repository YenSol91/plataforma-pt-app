<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nambi Core · App Android</title>
<style>
:root{--fondo:#071012;--tinta:#e3eef0;--neon:#3dff9a;--suave:#8fa8ad}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--tinta);font-family:system-ui,sans-serif;padding:16px}
main{max-width:420px;text-align:center}

<h1>Nambi Core</h1>
<p>App Android de Parque Tempisque. Solo funciona con una cuenta autorizada.</p>
<a class="btn" id="descargar" href="NambiCore.apk">Descargar APK</a>
<p id="version"></p>
<p>Si Android lo pide, permite "Instalar apps desconocidas" para el navegador y vuelve a abrir el archivo.</p>
</main>
<script>fetch('apk.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{document.getElementById('version').textContent='Versión '+a.nombre;}).catch(()=>{});</script>
